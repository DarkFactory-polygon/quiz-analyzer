[project]
name = "quiz-analyzer"
version = "0.1.0"
description = "CLI: доля верных ответов по вопросам квиза и список самых трудных вопросов"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quiz-analyzer = "quiz_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quiz_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
